name: Enforce Roxygen Title Case

on:
  workflow_dispatch:
  push:
    paths:
      - 'R/**'
    branches-ignore:
      - 'auto/format-titles'
  pull_request:
    paths:
      - 'R/**'

jobs:
  format-titles:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2, any::devtools

      - name: Run Title Formatter Script
        run: Rscript .github/scripts/format_roxygen_titles.R

      - name: Re-document Package
        run: Rscript -e "roxygen2::roxygenise()"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: auto-format Roxygen man page titles to Title Case"
          title: "Style: Auto-format Roxygen documentation titles"
          base: ${{ github.base_ref || github.ref_name }}
          add-paths: |
            R/*.R
            man/*.Rd
          body: |
            This is an auto-generated PR.

            The `format_roxygen_titles.R` script detected improperly cased titles in the `R/` directory. It has reformatted them to Title Cases, and regenerated the `.Rd` files.

            Please review the changes to ensure everything looks correct before merging.
          branch: "auto/format-titles"
          delete-branch: true
